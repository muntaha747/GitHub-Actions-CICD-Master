name: "04-filter-types.yml"

on:
  push:
    branches:
      - "develop"
      - "feature1" #This is the branch which we are trying to create 

    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review


    branches:
      - "main"


jobs:
  validation-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print Workflow Context
        run: |
          echo "Workflow triggered successfully"
          echo "Event Type: ${GITHUB_EVENT_NAME}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Repo: ${GITHUB_REPOSITORY_ID}"
          echo "Owner ${GITHUB_REPOSITORY_OWNER}"
          