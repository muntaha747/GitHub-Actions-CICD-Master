name: "01-ci-contexts.yml"
on: 
    push:
      branches: "main"
      paths:
        - "02-Workflow-Triggers/**" # This workflow only triggers for changes in folder 02

jobs:
    event-info-job:
            runs-on: ubuntu-latest
            steps:
                - name: Print Trigger Event
                  run: echo "My trigger event is ${{ github.event_name }} event"